# CI — the ungated test suite on every push/PR (V43, D65).
#
# Solver-gated tests (CalculiX / OpenFOAM / MYSTRAN) skip cleanly when the
# solvers are absent, as do the DWG tests (dwg2dxf + the untracked user DWG)
# and the real UCSF cardiac-family tests (external read-only data). What runs
# here is everything else: the whole core — geometry, meshing, exports,
# format-level deck golden cards, CSO/DICOM/NIfTI ingest + the adversarial
# security suites, web API, desktop-shell (Qt-free parts), CLI.
#
# The desktop extra (PySide6/QtWebEngine) is deliberately NOT installed: the
# only tests needing a live Qt window are opt-in (DIGITWIN_LIVE_SHELL=1).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # VTK/pyvista need a (virtual) display + GL on Linux; this installs
      # xvfb + mesa and exports DISPLAY for the whole job.
      - uses: pyvista/setup-headless-display-action@v3

      # The gmsh wheel links system GLU/X11 libs the runner image lacks.
      - name: Install gmsh system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install DigiTwin + extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[meshing,cad,recipes,image,web,viewport,dev]

      - name: Run test suite
        run: python -m pytest -q -rs
