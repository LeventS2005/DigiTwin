# Windows installer — on-demand build of the self-contained .exe installer
# (session 31; queue item 2 — the session-30 packaging probe said GO:
# win-64 conda-forge resolves the full runtime with qt6-webengine 6.11.1 ==
# qt6-main 6.11.1, the D54 rule).
#
# Manual trigger only (workflow_dispatch): the build solves the whole
# conda-forge runtime and uploads a large artifact — not something every
# push should pay for. Constructor CANNOT cross-build (its winexe.py execs a
# native makensis; probe, session 30) — hence the windows-latest job.
#
# TWO JOBS (D69): the meshforge package is NOARCH = platform-portable, and
# conda-build's generated cmd wrapper died with a parse error on the first
# windows-latest run — so the package builds on ubuntu (the proven Linux
# path) and the Windows job only runs constructor + the smoke test.
#
# HONEST TESTING LIMIT (mirrors the Linux workflow): a headless runner can
# smoke-test the silent install + CLI pipeline + the web server's /health,
# but CANNOT assert the GUI/WebGL desktop shell renders or that the
# Start-Menu shortcut works. Only the web path is CI-verified.
#
# UNSIGNED EXE: SmartScreen will warn on first run ("Windows protected your
# PC" -> "More info" -> "Run anyway") until a Windows code-signing
# certificate is bought — the user's decision, like Apple notarization.

name: Windows installer

on:
  workflow_dispatch:

jobs:
  build-noarch-pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: true
          activate-environment: ""
          conda-remove-defaults: "true"

      - name: Install build tools into base
        run: conda install -y -n base -c conda-forge conda-build

      - name: Build the noarch package into the local channel
        run: bash packaging/build_channel.sh

      - uses: actions/upload-artifact@v7
        with:
          name: meshforge-local-channel
          path: packaging/local-channel/
          retention-days: 1
          if-no-files-found: error

  build-exe-installer:
    needs: build-noarch-pkg
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}   # -l so the conda hook from setup-miniconda is active
    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: true
          activate-environment: ""
          conda-remove-defaults: "true"

      - name: Install build tools into base
        run: conda install -y -n base -c conda-forge conda-build constructor

      - uses: actions/download-artifact@v8
        with:
          name: meshforge-local-channel
          path: packaging/local-channel/

      - name: Build the installer from the prebuilt channel
        run: SKIP_PKG_BUILD=1 bash packaging/build_windows.sh

      # ISOLATED install step (runs 2+3 stalled >68 min producing ZERO output
      # from the `cmd //c start /wait … /S /InstallationType=JustMe` line —
      # everything after it never ran). pwsh Start-Process -Wait is the
      # pattern other conda-constructor CIs use; /InstallationType dropped
      # (suspect interactive blocker); own timeout so a stall fails FAST.
      - name: Silent install
        timeout-minutes: 45
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/meshforge-*-Windows-*.exe).FullName
          Write-Host "installing $installer"
          $p = Start-Process -FilePath $installer -ArgumentList '/S','/D=C:\mfapp' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          if (!(Test-Path 'C:\mfapp\Scripts\meshforge.exe')) { Write-Host 'meshforge.exe missing after install'; exit 1 }

      - name: Smoke test (CLI pipeline + web /health — no GUI assertion possible headlessly)
        timeout-minutes: 20
        run: |
          PREFIX=/c/mfapp
          # entry points live in Scripts\ on Windows (not bin/)
          SMOKE="$RUNNER_TEMP\\smoke"
          "$PREFIX/Scripts/meshforge.exe" synth straight_tube --outputs "$SMOKE"
          "$PREFIX/Scripts/meshforge.exe" volmesh "$SMOKE\\straight_tube.vtp" \
              --thickness 0.5 --outputs "$SMOKE"
          # stdio DETACHED to a file: a background child holding the step's
          # stdout pipe keeps the bash step alive forever on windows runners
          # (run 2 hung this way — the MSYS kill takes the exe shim, not its
          # Windows python child, and the orphan pinned the pipe; D69).
          "$PREFIX/Scripts/meshforge.exe" web --port 8765 \
              > "$RUNNER_TEMP/web.log" 2>&1 &
          server=$!
          ok=""
          for i in $(seq 1 90); do
            if curl -fs http://127.0.0.1:8765/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "web server never became healthy; log:"; cat "$RUNNER_TEMP/web.log" || true
            exit 1
          fi
          curl -fs http://127.0.0.1:8765/schema > /dev/null
          curl -fs http://127.0.0.1:8765/app/ | grep -qi meshforge
          # kill the WHOLE tree, not just the shim (//T), then the MSYS job
          taskkill //F //T //IM meshforge.exe || true
          kill "$server" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        with:
          name: meshforge-windows-installer
          path: dist/meshforge-*-Windows-*.exe
          retention-days: 14
          if-no-files-found: error
