# Linux installer — on-demand build of the self-contained .sh installer
# (session 30; the packaging-probe menu's "Linux" pick).
#
# Manual trigger only (workflow_dispatch): the build solves the whole
# conda-forge runtime (~15-30 min) and uploads a ~600 MB artifact — not
# something every push should pay for.
#
# HONEST TESTING LIMIT (probe, session 30): a headless runner can smoke-test
# the install + CLI pipeline + the web server's /health, but CANNOT assert
# the GUI/WebGL desktop shell renders. The installer ships both `meshforge
# web` and `meshforge desktop`; only the web path is CI-verified, so docs
# should steer Linux users to `meshforge web` until the shell is validated
# on a real Linux desktop.

name: Linux installer

on:
  workflow_dispatch:

jobs:
  build-sh-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}   # -l so the conda hook from setup-miniconda is active
    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-activate: true   # v4 name for auto-activate-base (deprecation fixed)
          activate-environment: ""
          conda-remove-defaults: "true"   # miniforge is conda-forge-only; drop the implicit 'defaults' hint

      - name: Install build tools into base
        run: conda install -y -n base -c conda-forge conda-build constructor

      - name: Build the installer
        run: bash packaging/build_linux.sh

      - name: Smoke test (install + CLI pipeline + web /health — no GUI assertion possible headlessly)
        run: |
          installer=$(ls dist/meshforge-*-Linux-*.sh)
          bash "$installer" -b -p "$HOME/meshforge-app"
          PREFIX="$HOME/meshforge-app"
          "$PREFIX/bin/meshforge" synth straight_tube --outputs /tmp/smoke
          "$PREFIX/bin/meshforge" volmesh /tmp/smoke/straight_tube.vtp \
              --thickness 0.5 --outputs /tmp/smoke
          "$PREFIX/bin/meshforge" web --port 8765 &
          server=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8765/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "web server never became healthy"; exit 1; }
          curl -fs http://127.0.0.1:8765/schema > /dev/null
          curl -fs http://127.0.0.1:8765/app/ | grep -qi meshforge
          kill "$server"

      - uses: actions/upload-artifact@v7
        with:
          name: meshforge-linux-installer
          path: dist/meshforge-*-Linux-*.sh
          retention-days: 14
          if-no-files-found: error
