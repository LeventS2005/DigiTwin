# constructor recipe — a self-contained macOS installer for the meshforge
# Workbench (osx-arm64). The whole runtime is pulled in transitively by the
# single `meshforge` package (its run deps are the full stack); the local
# channel holds that noarch package, built by packaging/build.sh.
#
# The user double-clicks the .pkg -> a native install wizard lays down a
# self-contained conda env under a prefix -> menuinst creates a `meshforge`
# .app that opens the Workbench. No terminal, no conda knowledge. The solvers
# (CalculiX/OpenFOAM/MYSTRAN) are NOT bundled — external/optional, runtime-found.
name: meshforge
version: 1.0.0

channels:
  - ./local-channel
  - conda-forge

specs:
  - python 3.12.*
  - meshforge 1.0.0

installer_type:
  - pkg
  - sh

# create the double-click launcher (Menu/meshforge.json shipped by the package)
menu_packages:
  - meshforge

# this is an app bundle, not a dev conda — don't touch the user's shell/conda init
initialize_by_default: false
