# constructor recipe — the self-contained digitwin Windows installer (.exe).
#
# Mirrors ../construct-linux/construct.yaml with the Windows differences:
# `installer_type: exe` (NSIS GUI installer; constructor pulls makensis on
# win-64 — it CANNOT cross-build, so this is built natively on a
# windows-latest runner; probe, session 30) and `register_python: false`
# (this is an app bundle, not a dev Python — don't offer registering it as
# the system Python). win-64 conda-forge resolves the full runtime with the
# D54-matched qt6-main/qt6-webengine pair (probe-verified: 6.11.1 == 6.11.1).
#
# UNSIGNED: Windows SmartScreen will warn on first run ("Windows protected
# your PC" -> "More info" -> "Run anyway") until a Windows code-signing
# certificate is bought — the user's decision, like Apple notarization (D69).
#
# TRAP (D57): constructor resolves relative channel paths against the CWD —
# run it from THIS directory (build_windows.sh does).
name: digitwin
version: 1.0.0

channels:
  - ../local-channel
  - conda-forge

specs:
  - python 3.12.*
  - digitwin 1.0.0

installer_type:
  - exe

# menuinst creates the Start-Menu shortcut from the package's Menu/
# digitwin.json — its `win` platform block points the command at
# Scripts\digitwin-desktop.exe (entry points live in Scripts\ on Windows,
# not bin/ — D69).
menu_packages:
  - digitwin

# app bundle, not a dev conda — no system-Python registration, no shell init
register_python: false
initialize_by_default: false
