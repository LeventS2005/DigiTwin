{% set version = "1.0.0" %}

# digitwin as a **noarch** conda package (it is pure-Python; the heavy native
# deps below come from conda-forge). This package is the single spec constructor
# installs — its run deps pull the whole runtime, and it ships the menuinst
# launcher (Menu/digitwin.json) so the installer creates a double-click .app.
#
# Source is a CLEAN `git archive` staged by packaging/build.sh into
# packaging/_build_src (tracked files only — no outputs/, .git, or the DWG).

package:
  name: digitwin
  version: {{ version }}

source:
  path: ../_build_src

build:
  noarch: python
  number: 0
  # build steps live in build.sh (pip install + ship the menuinst launcher)
  entry_points:
    - digitwin = digitwin.cli:main
    - digitwin-web = digitwin.web.server:main
    - digitwin-desktop = digitwin.gui.shell:main
    - digitwin-gui = digitwin.gui.shell:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=64
  run:
    - python >=3.10
    # base
    - pyvista >=0.47
    - vtk 9.6.*
    - meshio
    - numpy
    - scipy
    - scikit-image
    - networkx
    # web extra (pure-Python)
    - fastapi
    - uvicorn
    - httpx
    - python-multipart
    # viewport extra (vtk.js assets)
    - trame-vtk
    - trame-vuetify
    # desktop extra — the matched Qt pair (D54 no-exit-134 pairing)
    - pyside6 6.11.*
    - qt6-webengine 6.11.*
    # meshing + cad extras
    - python-gmsh
    - ezdxf
    # so constructor/conda can create the launcher shortcut
    - menuinst >=2

test:
  imports:
    - digitwin
    - digitwin.gui.shell
    - digitwin.web.server

about:
  home: https://github.com/LeventS2005/DigiTwin
  summary: Research-grade meshing toolkit — tubular/closed surfaces to solver-ready wall volume meshes
  license: Apache-2.0
