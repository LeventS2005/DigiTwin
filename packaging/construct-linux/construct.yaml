# constructor recipe — the self-contained digitwin Linux installer (.sh).
#
# Mirrors ../construct.yaml (the proven macOS recipe, V37/D57) with the one
# platform difference: Linux gets a shell installer only (pkg is macOS-only).
# Built natively on a linux-64 machine/CI runner — constructor's NSIS/pkg
# tooling cannot cross-build, but shar .sh installers build natively anywhere
# (probe, session 30). The local channel holds the SAME noarch digitwin
# package the macOS installer ships (built by build_linux.sh); conda-forge
# resolves the full runtime for linux-64 with the D54-matched
# qt6-main/qt6-webengine pair (probe-verified: 6.11.1 == 6.11.1).
#
# TRAP (D57): constructor resolves relative channel paths against the CWD —
# run it from THIS directory (build_linux.sh does).
name: digitwin
version: 1.0.0

channels:
  - ../local-channel
  - conda-forge

specs:
  - python 3.12.*
  - digitwin 1.0.0

installer_type:
  - sh

# menuinst creates a .desktop launcher from the package's Menu/digitwin.json.
# NOTE (D69): menuinst SKIPS platforms absent from the item's `platforms`
# dict (enabled_for_platform, menuinst 2.4.2) — the `linux: {}` block added
# in session 31 is what enables the launcher here; before that the installer
# shipped without one (the headless smoke cannot assert it).
menu_packages:
  - digitwin

# this is an app bundle, not a dev conda — don't touch the user's shell/conda init
initialize_by_default: false
